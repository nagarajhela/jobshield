# ==========================================
# JobShield Backend Configuration
# ==========================================

# Optional local overrides (gitignored)
spring.config.import=optional:classpath:application-local.properties

# ═══ SERVER CONFIG ═══
server.port=${PORT:8081}
server.servlet.context-path=/

# ═══ DATABASE CONFIG ═══
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ═══ FLYWAY DATABASE MIGRATION ═══
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ═══ CONNECTION POOL ═══
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ═══ JWT CONFIG ═══
app.jwt.secret=${JWT_SECRET:mySuperSecretKeyForJobShieldApplication123456789}
app.jwt.expiration=86400000

# ═══ AI CONFIG ═══
openrouter.api.key=${OPENROUTER_API_KEY:your_openrouter_api_key_here}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model=${OPENROUTER_MODEL:google/gemini-3.5-flash-lite}
openrouter.max.tokens=800

# Fallback & compatibility aliases
tokenrouter.api.url=${openrouter.api.url}
tokenrouter.api.key=${openrouter.api.key}
tokenrouter.model=${openrouter.model}
gemini.api.key=${openrouter.api.key}

# ═══ MAIL CONFIG ═══
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_mail_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ═══ SPRING ACTUATOR SETUP ═══
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.app.name=JobShield
management.info.app.version=2.0.0

# ═══ APP CONFIG ═══
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.name=JobShield
